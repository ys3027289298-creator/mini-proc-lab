  <text x="594.0" y="384.0" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#ffffff">✕ face E  s_v=3.00</text>
  <rect x="342.0" y="468.0" width="84.0" height="118.8" fill="#0ca30c" stroke="#0b0b0b" stroke-width="1.00"/>
  <text x="384.0" y="532.4" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">✓ slope s_v=1.41</text>
  <text x="384.0" y="376.0" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#52514e">台地顶面 TOP</text>
  <text x="384.0" y="396.0" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#898781">4m × 4m</text>
  <text x="384.0" y="68.0" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#0b0b0b">北墙 N（铰链 = 北缘）</text>
