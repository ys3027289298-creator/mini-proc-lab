  <text x="384.0" y="812.4" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#52514e">南坡 45°（坡长 6√2 m，连续面，贴花不失效）</text>
  <rect x="300.0" y="836.0" width="360" height="36" rx="8" fill="#fff5f5" stroke="#d03b3b" stroke-width="2"/>
  <text x="314.0" y="859.0" font-family="system-ui,sans-serif" font-size="14" text-anchor="start" fill="#d03b3b">✕ OVER 极限（s_v&gt;2.5）→ 所在面：东墙 E，L=2m 盖 6m 墙高，H/L=3.00</text>
  <text x="760.0" y="280.0" font-family="system-ui,sans-serif" font-size="15" text-anchor="start" fill="#0b0b0b">拉伸档位（主拉伸 smax）</text>
  <rect x="760.0" y="308.0" width="26" height="24" fill="#0ca30c" stroke="#0b0b0b" stroke-width="1"/>
  <text x="773.0" y="326.0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">✓</text>
  <text x="796.0" y="325.0" font-family="system-ui,sans-serif" font-size="13" text-anchor="start" fill="#0b0b0b">OK    smax &lt;= 1.5</text>
  <rect x="760.0" y="344.0" width="26" height="24" fill="#fab219" stroke="#0b0b0b" stroke-width="1"/>
  <line x1="762.0" y1="366.0" x2="784.0" y2="346.0" stroke="#8a6200" stroke-width="2"/>
  <text x="773.0" y="362.0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#0b0b0b">!</text>
  <text x="796.0" y="361.0" font-family="system-ui,sans-serif" font-size="13" text-anchor="start" fill="#0b0b0b">WARN  1.5 &lt; smax &lt;= 2.5</text>
  <rect x="760.0" y="380.0" width="26" height="24" fill="#d03b3b" stroke="#0b0b0b" stroke-width="2.5"/>
  <line x1="762.0" y1="402.0" x2="784.0" y2="382.0" stroke="#7a1f1f" stroke-width="2"/>
  <text x="773.0" y="398.0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">✕</text>
  <text x="796.0" y="397.0" font-family="system-ui,sans-serif" font-size="13" text-anchor="start" fill="#0b0b0b">OVER  smax &gt; 2.5</text>
  <text x="760.0" y="428.0" font-family="system-ui,sans-serif" font-size="12" text-anchor="start" fill="#898781">符号 ✓ / ! / ✕ 与斜纹为颜色之外的冗余编码</text>
  <text x="760.0" y="448.0" font-family="system-ui,sans-serif" font-size="12" text-anchor="start" fill="#898781">失活：n_z &lt; cos70° ≈ 0.342 时贴花不投影</text>
</svg>
