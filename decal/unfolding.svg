  <text x="384.0" y="174.0" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#ffffff">✓ face N  s_v=1.50</text>
  <defs><pattern id="hatchWarn" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fab219"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8a6200" stroke-width="2"/></pattern></defs>
  <rect x="48.0" y="321.0" width="252.0" height="126.0" fill="none" stroke="#0b0b0b" stroke-width="1.00"/>
