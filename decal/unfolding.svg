  <text x="470.0" y="34.0" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle" fill="#0b0b0b">悬崖贴花表面展开图（unfolding net，真实边长摊平）</text>
  <text x="470.0" y="58.0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#52514e">铰链边等长；贴花矩形高 = 参考边长 L × 垂直拉伸 s_v；颜色/符号/斜纹三重编码拉伸档位</text>
