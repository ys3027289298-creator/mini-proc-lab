  <text x="174.0" y="384.0" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#0b0b0b">! face W  s_v=2.00</text>
  <defs><pattern id="hatchOver" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#d03b3b"/><line x1="0" y1="0" x2="0" y2="8" stroke="#7a1f1f" stroke-width="2"/></pattern></defs>
  <rect x="468.0" y="342.0" width="252.0" height="84.0" fill="none" stroke="#0b0b0b" stroke-width="3.00"/>
