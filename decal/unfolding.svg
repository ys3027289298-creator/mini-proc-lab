  <rect x="300.0" y="300.0" width="168.0" height="168.0" fill="#e9e7df" stroke="#0b0b0b" stroke-width="1.50"/>
  <rect x="316.8" y="316.8" width="42.0" height="42.0" fill="#0ca30c" stroke="#0b0b0b" stroke-width="1.00"/>
